<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        textarea:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden antialiased text-gray-800">

    <div class="w-80 bg-[#f9fafb] border-r border-gray-200 flex flex-col flex-shrink-0 z-10">
        <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-white">
            <span class="font-semibold text-gray-900 tracking-tight">Platform</span>
        </div>

        <div class="p-5 flex-1 overflow-y-auto space-y-6">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Create Agent</label>
                <textarea id="transcript" rows="4" class="w-full bg-white text-gray-900 p-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition-all text-sm resize-none" placeholder="Describe what this agent should do..."></textarea>
                <button id="compileBtn" onclick="buildAgent()" class="w-full mt-3 bg-gray-900 hover:bg-gray-800 text-white font-medium py-2.5 rounded-xl transition-colors text-sm flex justify-center items-center gap-2">
                    Deploy
                </button>
            </div>

            <div id="statsCard" class="hidden">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Active Context</label>
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <span id="displayAgentName" class="text-sm font-semibold text-gray-900 block mb-1"></span>
                    <p id="displayAgentDesc" class="text-xs text-gray-500 leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col bg-white relative">
        <div class="h-16 border-b border-gray-100 flex items-center justify-between px-6 bg-white/80 backdrop-blur-md absolute top-0 w-full z-10">
            <div class="flex items-center gap-3">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-gray-300"></span>
                <span id="headerAgentName" class="text-sm font-medium text-gray-800">No agent active</span>
            </div>
        </div>

        <div id="chatBox" class="flex-1 overflow-y-auto px-6 pt-24 pb-32 space-y-6 w-full max-w-4xl mx-auto">
            <div class="flex items-start justify-center h-full text-gray-400 text-sm mt-20">
                Deploy an agent from the sidebar to begin.
            </div>
        </div>

        <div class="absolute bottom-0 w-full bg-gradient-to-t from-white via-white to-transparent pt-6 pb-6 px-6">
            <div class="max-w-4xl mx-auto relative flex items-end bg-[#f4f4f5] border border-gray-200 rounded-2xl p-2 transition-all focus-within:ring-2 focus-within:ring-blue-100 focus-within:bg-white shadow-sm">
                <textarea id="chatInput" rows="1" class="flex-1 bg-transparent text-gray-900 px-3 py-2.5 text-[15px] resize-none max-h-[200px] leading-relaxed disabled:opacity-50" placeholder="Message the agent..." disabled></textarea>
                <button id="sendBtn" onclick="sendChatMessage()" disabled class="p-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition-colors disabled:opacity-50 disabled:bg-gray-300 mb-0.5 ml-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V6m0 0l-8 8m8-8l8 8"></path></svg>
                </button>
            </div>
            <p class="text-[11px] text-center text-gray-400 mt-3">Agents can make mistakes. Verify important information.</p>
        </div>
    </div>

    <script>
        let currentAgentName = "";

        const chatInput = document.getElementById("chatInput");
        chatInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!document.getElementById("sendBtn").disabled) sendChatMessage(); }
        });
        chatInput.addEventListener("input", function() { this.style.height = "auto"; this.style.height = this.scrollHeight + "px"; });

        async function buildAgent() {
            const transcript = document.getElementById("transcript").value.trim();
            if (!transcript) return;
            const btn = document.getElementById("compileBtn");
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" class="opacity-25"></circle><path fill="currentColor" d="M4 12a8 8 0 018-8v8h8a8 8 0 01-16 0z" class="opacity-75"></path></svg> Deploying...`;
            btn.disabled = true;

            try {
                const res = await fetch("http://localhost:5000/agents/compile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ transcript })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Deployment failed.");

                currentAgentName = data.blueprint.agent_name;

                document.getElementById("statsCard").classList.remove("hidden");
                document.getElementById("displayAgentName").innerText = currentAgentName;
                document.getElementById("displayAgentDesc").innerText = data.blueprint.description;
                document.getElementById("headerAgentName").innerText = currentAgentName;
                document.getElementById("statusDot").classList.replace("bg-gray-300", "bg-green-500");

                chatInput.disabled = false; document.getElementById("sendBtn").disabled = false;
                chatInput.focus();

                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML = `
                    <div class="flex flex-col space-y-2 mb-8 items-center text-center">
                        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-2">
                            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-900">${currentAgentName} deployed</h2>
                        <p class="text-sm text-gray-500 max-w-sm">Agent is online and ready to assist you.</p>
                    </div>`;
            } catch (err) { alert(err.message); }
            finally { btn.innerHTML = "Deploy"; btn.disabled = false; }
        }

        async function sendChatMessage() {
            const message = chatInput.value.trim();
            if (!message || !currentAgentName) return;

            chatInput.value = ""; chatInput.style.height = "auto";
            const chatBox = document.getElementById("chatBox");

            chatBox.innerHTML += `
                <div class="flex justify-end mb-4">
                    <div class="bg-[#f4f4f5] text-gray-900 rounded-2xl rounded-br-sm px-5 py-3 max-w-[80%] shadow-sm text-[15px] leading-relaxed">
                        ${message.replace(/\n/g, '<br>')}
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const loaderId = "loading-" + Date.now();
            chatBox.innerHTML += `
                <div id="${loaderId}" class="flex justify-start mb-4">
                    <div class="flex items-center space-x-2 bg-white px-4 py-3 rounded-2xl text-gray-400">
                        <div class="w-2 h-2 bg-gray-300 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Updated to connect directly to the FastAPI server on port 8000
                const res = await fetch("http://127.0.0.1:8000/v1/agent/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ agent_name: currentAgentName, message: message })
                });

                const data = await res.json();
                document.getElementById(loaderId).remove();

                chatBox.innerHTML += `
                    <div class="flex justify-start mb-4">
                        <div class="text-gray-900 rounded-2xl px-2 py-2 max-w-[85%] text-[15px] leading-relaxed whitespace-pre-wrap">
                            ${data.response}
                        </div>
                    </div>`;
            } catch (err) {
                document.getElementById(loaderId).remove();
                chatBox.innerHTML += `<div class="text-red-500 text-sm px-2">Failed to fetch response. Check if Python server is running.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
