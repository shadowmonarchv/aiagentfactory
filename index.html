<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta-Agent Builder & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for chat log and text area */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#09090b] text-gray-200 antialiased min-h-screen flex items-center justify-center relative overflow-hidden p-4 sm:p-6">

    <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-indigo-900/20 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-emerald-900/10 blur-[120px] pointer-events-none"></div>

    <div class="max-w-5xl w-full relative z-10 grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

        <div class="md:col-span-5 w-full space-y-6">
            <div class="text-left">
                <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-emerald-400">
                    AI Agent Factory
                </h1>
                <p class="text-gray-400 text-sm font-light mt-1">Design, compile, and instantly interface with custom intelligences.</p>
            </div>

            <div class="glass-panel p-5 rounded-2xl shadow-2xl transition-all duration-300 hover:border-white/10">
                <textarea id="userInput" class="w-full bg-transparent text-gray-100 p-3 rounded-xl focus:outline-none resize-none text-base placeholder-gray-600 border border-transparent focus:border-white/5 transition-all" rows="4" placeholder="Describe your agent's objective (e.g., An expert database engineer specializing in SQL performance optimization...)"></textarea>
                <div class="mt-3">
                    <button onclick="buildAgent()" id="buildBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3 px-4 rounded-xl transition-all duration-300 shadow-lg shadow-indigo-500/25 active:scale-[0.98] flex justify-center items-center gap-2 text-sm">
                        <span>Construct Agent</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </button>
                </div>
            </div>

            <div id="resultBox" class="hidden animate-fade-in glass-panel p-6 rounded-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-indigo-500 to-purple-500"></div>

                <div class="mb-4">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500 block mb-0.5">Designation</span>
                    <span id="agentName" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-purple-300"></span>
                </div>

                <div class="mb-4">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500 block mb-0.5">Directive</span>
                    <span id="agentDesc" class="text-gray-400 text-sm leading-relaxed"></span>
                </div>

                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500 block mb-2">Equipped Tools</span>
                    <div id="agentTools" class="flex gap-2 flex-wrap"></div>
                </div>
            </div>
        </div>

        <div class="md:col-span-7 w-full">
            <div id="chatBox" class="hidden animate-fade-in glass-panel rounded-2xl shadow-2xl h-[550px] flex flex-col overflow-hidden transition-all duration-300 hover:border-white/10">
                <div class="px-6 py-4 border-b border-white/5 bg-white/[0.01] flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <h3 class="font-semibold text-sm tracking-wide text-gray-200">Live Agent Console: <span id="consoleAgentName" class="text-indigo-400 font-mono"></span></h3>
                    </div>
                    <span class="text-[10px] font-mono uppercase bg-white/5 px-2 py-0.5 rounded text-gray-400 tracking-wider">Ready</span>
                </div>

                <div id="chatLog" class="flex-1 p-6 overflow-y-auto space-y-4 custom-scrollbar text-sm flex flex-col">
                    </div>

                <div class="p-4 border-t border-white/5 bg-white/[0.01]">
                    <div class="flex gap-2 bg-black/20 rounded-xl p-1.5 border border-white/5 focus-within:border-white/10 transition-all items-end">
                        <textarea id="chatInput" onkeydown="handleChatKeydown(event)" rows="1" class="flex-1 bg-transparent text-gray-100 px-3 py-3 text-sm focus:outline-none placeholder-gray-600 resize-none max-h-32 custom-scrollbar overflow-y-auto" placeholder="Issue a directive (Shift + Enter for new line)..."></textarea>
                        <button onclick="sendChatMessage()" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-lg transition-all font-medium text-sm flex items-center justify-center mb-0.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentAgentName = "";

        // --- 1. BULLETPROOF KEYDOWN LISTENERS ---
        document.addEventListener("DOMContentLoaded", () => {
            const chatInput = document.getElementById('chatInput');
            const userInput = document.getElementById('userInput');

            // Attach to Chat Box
            if(chatInput) {
                chatInput.addEventListener('keydown', function(e) {
                    handleAutoResize(this);
                    if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey) {
                        e.preventDefault(); // Stop new line
                        sendChatMessage();
                        setTimeout(() => { this.style.height = 'auto'; }, 10);
                    }
                });
            }

            // Attach to Main Builder Box (So Enter works here too!)
            if(userInput) {
                userInput.addEventListener('keydown', function(e) {
                    if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey) {
                        e.preventDefault();
                        buildAgent();
                    }
                });
            }
        });

        function handleAutoResize(el) {
            setTimeout(() => {
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            }, 0);
        }

        // --- 2. BUILD AGENT LOGIC ---
        async function buildAgent() {
            const btn = document.getElementById('buildBtn');
            const input = document.getElementById('userInput').value;
            const resultBox = document.getElementById('resultBox');
            const chatBox = document.getElementById('chatBox');

            if (!input.trim()) return;

            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Compiling Matrix...`;
            btn.disabled = true;
            btn.classList.add('opacity-70');
            resultBox.classList.add('hidden');
            chatBox.classList.add('hidden');

            try {
                const response = await fetch('/api/v1/factory/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: input })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert("THE SERVER CRASHED:\n\n" + data.detail);
                    return;
                }

                currentAgentName = data.blueprint.agent_name;

                document.getElementById('agentName').innerText = data.blueprint.agent_name;
                document.getElementById('agentDesc').innerText = data.blueprint.description;
                document.getElementById('consoleAgentName').innerText = data.blueprint.agent_name;

                let toolsHtml = "";
                if (data.blueprint.required_tools.length === 0) {
                    toolsHtml = `<span class="px-2.5 py-1 rounded-md bg-gray-500/5 border border-gray-500/10 text-gray-500 text-xs font-mono tracking-tight">No tools required</span>`;
                } else {
                    toolsHtml = data.blueprint.required_tools.map(tool =>
                        `<span class="px-2.5 py-1 rounded-md bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-mono tracking-tight">${tool}</span>`
                    ).join('');
                }
                document.getElementById('agentTools').innerHTML = toolsHtml;

                const chatLog = document.getElementById('chatLog');
                chatLog.innerHTML = `
                    <div class="self-start max-w-[85%] bg-white/[0.02] border border-white/5 rounded-2xl px-4 py-3 rounded-tl-none text-gray-300">
                        Greeting Operator. I am <span class="text-indigo-400 font-mono font-semibold">${currentAgentName}</span>. My matrix has been initialized successfully. Directives received. What is your requirement?
                    </div>
                `;

                resultBox.classList.remove('hidden');
                chatBox.classList.remove('hidden');

            } catch (err) {
                alert("CRITICAL CONNECTION ERROR:\n\n" + err.message);
            } finally {
                btn.innerHTML = `<span>Construct Agent</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        }

        // --- 3. CHAT LOGIC ---
        async function sendChatMessage() {
            const chatInput = document.getElementById('chatInput');
            const chatLog = document.getElementById('chatLog');
            const sendBtn = document.getElementById('sendBtn');
            const message = chatInput.value.trim();

            if (!message || !currentAgentName) return;

            const userMsgElement = document.createElement('div');
            userMsgElement.className = "self-end max-w-[85%] bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl px-4 py-3 rounded-tr-none shadow-md shadow-indigo-500/5 transition-all whitespace-pre-wrap";
            userMsgElement.innerText = message;
            chatLog.appendChild(userMsgElement);

            chatInput.value = "";
            chatLog.scrollTop = chatLog.scrollHeight;

            const thinkingElement = document.createElement('div');
            thinkingElement.className = "self-start max-w-[85%] bg-white/[0.02] border border-white/5 rounded-2xl px-4 py-3 rounded-tl-none text-gray-500 italic animate-pulse";
            thinkingElement.innerText = `${currentAgentName} is running matrix protocols...`;
            chatLog.appendChild(thinkingElement);
            chatLog.scrollTop = chatLog.scrollHeight;

            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/v1/agent/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_name: currentAgentName,
                        message: message
                    })
                });

                const data = await response.json();
                chatLog.removeChild(thinkingElement);

                if (!response.ok) {
                    const errorElement = document.createElement('div');
                    errorElement.className = "self-start max-w-[85%] bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl px-4 py-3 rounded-tl-none font-mono text-xs";
                    errorElement.innerText = `[CRITICAL EXCEPTION] ${data.detail}`;
                    chatLog.appendChild(errorElement);
                    return;
                }

                const agentMsgElement = document.createElement('div');
                agentMsgElement.className = "self-start max-w-[85%] bg-white/[0.02] border border-white/5 rounded-2xl px-4 py-3 rounded-tl-none text-gray-300 leading-relaxed whitespace-pre-wrap";
                agentMsgElement.innerText = data.response;
                chatLog.appendChild(agentMsgElement);

            } catch (err) {
                if (chatLog.contains(thinkingElement)) chatLog.removeChild(thinkingElement);
                const networkErrorElement = document.createElement('div');
                networkErrorElement.className = "self-start max-w-[85%] bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl px-4 py-3 rounded-tl-none font-mono text-xs";
                networkErrorElement.innerText = `[NETWORK ERROR] Failed to contact agent console: ${err.message}`;
                chatLog.appendChild(networkErrorElement);
            } finally {
                sendBtn.disabled = false;
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        }
    </script>
</body>
</html>
